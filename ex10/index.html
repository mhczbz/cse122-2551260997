<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ với chúng tôi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="khung-lien-he">
        <header class="dau-bieu-mau">
            <h1>Liên hệ với chúng tôi</h1>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong thời gian sớm nhất.</p>
        </header>

        <form class="bieu-mau" action="#" method="post">
            <div class="nhom-truong">
                <label for="ho-ten">Họ và tên <span class="bat-buoc">*</span></label>
                <input type="text" id="ho-ten" name="ho-ten" placeholder="Nhập họ và tên của bạn" required>
            </div>

            <div class="hang-2-cot">
                <div class="nhom-truong">
                    <label for="email">Email <span class="bat-buoc">*</span></label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="nhom-truong">
                    <label for="dien-thoai">Số điện thoại</label>
                    <input type="tel" id="dien-thoai" name="dien-thoai" placeholder="09xx xxx xxx">
                </div>
            </div>

            <div class="nhom-truong">
                <label for="chu-de">Chủ đề liên hệ</label>
                <select id="chu-de" name="chu-de">
                    <option value="tu-van">Tư vấn sản phẩm / dịch vụ</option>
                    <option value="ho-tro">Hỗ trợ kỹ thuật</option>
                    <option value="gop-y">Góp ý / Khiếu nại</option>
                    <option value="hop-tac">Hợp tác kinh doanh</option>
                    <option value="khac">Chủ đề khác</option>
                </select>
            </div>

            <div class="nhom-truong">
                <label for="noi-dung">Nội dung tin nhắn <span class="bat-buoc">*</span></label>
                <textarea id="noi-dung" name="noi-dung" rows="5" placeholder="Nhập nội dung bạn muốn gửi..." required></textarea>
            </div>

            <div class="nhom-nut">
                <button type="submit" class="nut nut-gui">Gửi liên hệ</button>
                <button type="reset" class="nut nut-nhap-lai">Nhập lại</button>
            </div>
        </form>
    </main>
</body>
</html>
