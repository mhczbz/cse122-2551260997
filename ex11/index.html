<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh danh thắng Việt Nam</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="thu-vien">
        <header class="tieu-de">
            <h1>Thư viện ảnh Việt Nam</h1>
            <p class="mo-ta">Bộ sưu tập 6 danh thắng tiêu biểu &mdash; minh họa thẻ figure / figcaption.</p>
        </header>

        <div class="luoi-anh">
            <figure>
                <img src="images/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
            </figure>

            <figure>
                <img src="images/2-son-doong.jpg" alt="Hang Sơn Đoòng">
                <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>

            <figure>
                <img src="images/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                <figcaption>Hình 3. Thác Bản Giốc</figcaption>
            </figure>

            <figure>
                <img src="images/4-fansipan.jpg" alt="Fansipan">
                <figcaption>Hình 4. Fansipan</figcaption>
            </figure>

            <figure>
                <img src="images/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>

            <figure>
                <img src="images/6-phongnha.jpg" alt="Động Phong Nha">
                <figcaption>Hình 6. Động Phong Nha</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
