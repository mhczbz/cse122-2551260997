<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 01 - Bốn Mùa</title>
    <style>
        :root {
            --bg-khung: #FFFDE7;
            --vien-khung: #9E9E9E;
            --mau-tieu-de: #D40000;
            --bg-tieu-de: #FFD9E6;
            --mau-xanh: #0033CC;
            --mau-do: #D40000;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .khung-tho {
            background-color: var(--bg-khung);
            border: 1px solid var(--vien-khung);
            width: 640px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }

        .khung-tho h1 {
            color: var(--mau-tieu-de);
            background-color: var(--bg-tieu-de);
            font-size: 26px;
            padding: 6px 0;
            margin: 0 0 20px 0;
        }

        .khung-tho p {
            font-style: italic;
            line-height: 1.7;
            margin: 15px 0;
        }

        .kho-xanh {
            color: var(--mau-xanh);
        }

        .kho-do {
            color: var(--mau-do);
        }

        .khung-tho hr {
            border: none;
            border-top: 1px solid var(--mau-xanh);
            width: 55%;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <article class="khung-tho">
        <h1>BỐN MÙA</h1>
        
        <p class="kho-xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <p class="kho-xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </article>

</body>
</html>
